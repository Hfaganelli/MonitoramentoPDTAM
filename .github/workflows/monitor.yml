name: Monitor de preços

on:
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # botão "Verificar agora" do painel
    inputs:
      teste_telegram:
        description: "Só enviar uma mensagem de teste no Telegram"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["products.json"]  # roda assim que você adiciona um produto

permissions:
  contents: write

concurrency:
  group: monitor-precos
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testar Telegram
        if: ${{ inputs.teste_telegram }}
        run: python scraper/monitor.py --telegram-teste
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Verificar preços
        if: ${{ !inputs.teste_telegram }}
        run: python scraper/monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ALERTA_QUEDA_PCT: ${{ vars.ALERTA_QUEDA_PCT }}
          ALERTA_CUPOM_PCT: ${{ vars.ALERTA_CUPOM_PCT }}

      - name: Salvar histórico
        if: ${{ !inputs.teste_telegram }}
        run: |
          git config user.name "monitor-precos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Preços atualizados $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
